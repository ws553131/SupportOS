[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportos"
version = "0.1.0"
description = "AI 原生客服运营后台：在权限与风险规则约束下安全执行客服业务动作"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# ★ 注意：V0.1 **没有实现 Web UI**，因此这里不声明 fastapi / uvicorn / jinja2。
#   曾一度声明过 —— 那会造成「依赖清单写着 Web 框架、代码里一行没用」的
#   虚假信号，面试追问时会立刻露馅。
#   若将来实现 UI，在此处加回即可。
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

# 测试用标准 pytest 写法，但在受限环境下（无法安装 pytest）可用自带的
# 兼容运行器执行：python scripts/run_tests.py
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
